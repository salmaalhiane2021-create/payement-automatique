# ---------------------------------------------------------------------------
# Configuration Alembic — NexPay AI
#
# L'URL de la base n'est PAS figée ici : `migrations/env.py` utilise
# `DATABASE_URL` (via app.config.settings) ou celle fournie par le code
# applicatif. Ce fichier sert surtout à l'usage en ligne de commande :
#
#   .venv\Scripts\python -m alembic upgrade head      # appliquer les migrations
#   .venv\Scripts\python -m alembic current           # révision actuelle
#   .venv\Scripts\python -m alembic history           # historique
#
# En cas de base existante sans table `alembic_version`, utilisez plutôt
# `python -m app.migrations` : la base est automatiquement « estampillée » au
# niveau de la révision initiale, puis les migrations suivantes s'appliquent
# sans perte de données.
# ---------------------------------------------------------------------------
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
